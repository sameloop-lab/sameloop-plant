[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "sameloop-plant"
version = "0.1.0"
description = "Modèle thermique et ventilateur déterministe pour SameLoop"
requires-python = ">=3.10"
license = "MIT"
[project.scripts]
sameloop-plant = "sameloop_plant.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
